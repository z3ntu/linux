%YAML 1.2
---
$id: http://devicetree.org/schemas/display/panel/visionox,g2678fp111.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Visionox G2678FP111 6.77" 1080x2392 AMOLED Panel

maintainers:
  - Alexander Koskovich <akoskovich@pm.me>

description:
  This is a 6.77" AMOLED video mode display panel on a MIPI-DSI 4-lane
  interface.

  The panel also requires ELVDD/ELVSS/ELAVDD rails but these are
  internally managed by the panel via EL_ON1 (ELAVDD) and EL_ON2
  (ELVDD/ELVSS) control signals, they are not managed by the platform.

  The driver IC for this panel assembly is an RM69220.

allOf:
  - $ref: panel-common.yaml#

properties:
  compatible:
    const: visionox,g2678fp111

  reg:
    maxItems: 1

  dvdd-supply:
    description: Digital voltage rail

  vci-supply:
    description: Analog voltage rail

  vddio-supply:
    description: I/O voltage rail

required:
  - compatible
  - reg
  - reset-gpios
  - dvdd-supply
  - vci-supply
  - vddio-supply
  - port

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    dsi {
        #address-cells = <1>;
        #size-cells = <0>;

        panel@0 {
            compatible = "visionox,g2678fp111";
            reg = <0>;

            reset-gpios = <&tlmm 12 GPIO_ACTIVE_LOW>;
            dvdd-supply = <&vreg_oled_dvdd_1p8>;
            vci-supply = <&vreg_l19b>;
            vddio-supply = <&vreg_l9b>;

            port {
                panel_in_0: endpoint {
                    remote-endpoint = <&dsi0_out>;
                };
            };
        };
    };

...
